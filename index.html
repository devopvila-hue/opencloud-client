<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080908" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="DEPARTIFY Client Portal — your Business Operating System for AI departments." />

    <!--
      DEPARTIFY favicon — inline SVG data URI so we ship no extra
      asset request. Matches the brand mark used in <Logo />.
      Browsers without data-URI favicon support (very old) fall
      back to the default /favicon.ico, which Netlify returns 404
      for without breaking the page.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d8ff62'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='22' fill='%230a0c08'%3ED%3C/text%3E%3C/svg%3E"
    />

    <!--
      Design system fonts. Loaded from rsms.me (Inter, sans) and
      Google Fonts (Fraunces, display). Preconnect cuts the TLS
      handshake for both domains so the first paint isn't FOIT.
    -->
    <link rel="preconnect" href="https://rsms.me/" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <title>DEPARTIFY — Business Operating System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
