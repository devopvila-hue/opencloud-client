<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080908" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="DEPARTIFY · Client Portal — tu Business Operating System para departamentos de IA." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.departify.app/" />

    <!--
      Open Graph + Twitter Card — DEPARTIFY Client Portal.
      Centralised here so the Portal reads as part of the same
      product as the Landing (https://departify.app). The DNA
      manual lives at https://docs.departify.app and the API at
      https://api.departify.app — both referenced from og:see_also
      so social cards expose the full ecosystem.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DEPARTIFY" />
    <meta property="og:title" content="DEPARTIFY — Business Operating System" />
    <meta property="og:description" content="DEPARTIFY es la plataforma que opera una empresa a través de un Director Ejecutivo y departamentos inteligentes — silenciosa, estructural y construida para escalar." />
    <meta property="og:url" content="https://app.departify.app/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://app.departify.app/og-image.svg" />
    <meta property="og:see_also" content="https://departify.app" />
    <meta property="og:see_also" content="https://docs.departify.app" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DEPARTIFY — Business Operating System" />
    <meta name="twitter:description" content="DEPARTIFY es la plataforma que opera una empresa a través de un Director Ejecutivo y departamentos inteligentes." />
    <meta name="twitter:image" content="https://app.departify.app/og-image.svg" />

    <!--
      DEPARTIFY favicon — inline SVG data URI so we ship no extra
      asset request. Path matches the brand mark consumed by
      <Logo /> and the public Landing (/favicon.svg). Browsers
      without data-URI favicon support (very old) fall back to
      the default /favicon.ico, which Netlify returns 404 for
      without breaking the page.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101214'/%3E%3Cg fill='%23d8ff62'%3E%3Crect x='15' y='14' width='6' height='36'/%3E%3Crect x='43' y='14' width='6' height='36'/%3E%3Cpolygon points='15,14 21,14 49,50 43,50'/%3E%3C/g%3E%3C/svg%3E"
    />

    <!--
      Design system fonts. Loaded from rsms.me (Inter, sans) and
      Google Fonts (Fraunces, display). Preconnect cuts the TLS
      handshake for both domains so the first paint isn't FOIT.
    -->
    <link rel="preconnect" href="https://rsms.me/" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <title>DEPARTIFY — Business Operating System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
